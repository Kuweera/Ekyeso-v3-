name: Build Ekyeso APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Sync web files
        run: npx cap sync android

      - name: Show fingerprint of the repo keystore
        run: |
          ls -l keystore/debug.keystore
          keytool -list -v -keystore keystore/debug.keystore -storepass android | grep -E "SHA256"

      - name: Force Gradle to sign with the repo keystore
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Show fingerprint the APK was signed with
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ekyeso-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
